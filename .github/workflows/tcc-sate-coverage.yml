name: SATE - Backend e app Flutter

on:
  push:
    branches:
      - tcc/swagger-jest-por-rota-20261118
      - fix/integracao-app-backend-20261122
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  backend:
    name: Jest e cobertura (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sate_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências (atualiza lock legado)
        run: npm install --no-audit --no-fund
      - name: Validar JSON e cliente Prisma
        env:
          # Apenas para Prisma generate; nenhum banco é acessado neste job.
          DATABASE_URL: mysql://root:ci@127.0.0.1:3306/sate_ci
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          npx prisma generate
      - name: Executar testes Jest com cobertura
        run: npm run test:coverage
      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: sate_backend/coverage/
          if-no-files-found: ignore

  flutter:
    name: Flutter analyze e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sate_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes Flutter (quando presentes)
        run: |
          if find test -name '*_test.dart' -type f 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "Sem testes Flutter; análise estática executada."
          fi

  integracao:
    name: Integração real API + MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: sate_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/sate_ci
      JWT_SECRET: chave-local-exclusiva-de-testes-ci-nao-usar-em-producao
      # Turnstile sem secret em CI: testamos autenticação e integração funcional.
    defaults:
      run:
        working-directory: sate_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Criar esquema no MySQL temporário
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Iniciar API e aguardar healthcheck
        run: |
          node src/server.js > /tmp/sate-api-ci.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo "API pronta."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sate-api-ci.log
          exit 1
      - name: Testar fluxos entre site, banco e app
        run: node scripts/teste_integracao.js
      - name: Logs do backend em caso de erro
        if: failure()
        run: cat /tmp/sate-api-ci.log || true
